name: CI

on:
  push:
    branches: [main, my-changes]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-backend
    env:
      # Minimal env for the app to import; tests don't touch the real DB
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      SYNC_DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: school-backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (test + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: school-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npx eslint src
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
